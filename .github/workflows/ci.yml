# CI for AutoForge itself: lint, type-check, tests, and a Docker build smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · types · tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Tests (offline, no secrets)
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t autoforge:ci .
      - name: Smoke test
        run: |
          docker run --rm autoforge:ci autoforge --help
          docker run --rm autoforge:ci python -c "import autoforge.app.webhook"
