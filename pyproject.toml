[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge"
version = "0.1.0"
description = "Agentic coding assistant for automotive embedded software (ASPICE SWE.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autoforge = "autoforge.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
