[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge"
version = "0.1.0"
description = "Agentic coding assistant for automotive embedded software (ASPICE SWE.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=2.0"]

[project.scripts]
autoforge = "autoforge.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: talks to the real sandbox repo; opt-in with AUTOFORGE_INTEGRATION=1"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow typographic characters (·, →, ’) in docs and messages
    "UP042",  # keep (str, Enum): StrEnum changes str() output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy secrets are fine in tests
"docs/**" = ["E501", "B007", "B905"]  # SVG generator scripts: coordinate tables

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["autoforge"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["autoforge", "tests"]
