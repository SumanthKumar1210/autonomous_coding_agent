<text x="893.5" y="688" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Phase 3 · Requirements &amp; Polarion</text>
<text x="893.5" y="708" font-size="12" fill="#424a53" text-anchor="middle">Requirements + traceability (SYS.2/SWE.1)</text>
<text x="893.5" y="728" font-size="12" font-weight="700" fill="#8c959f" text-anchor="middle">Planned</text>
<polygon points="1065,656 1358,656 1380,702.0 1358,748 1065,748 1087,702.0" fill="#f3f4f6" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4"/>
