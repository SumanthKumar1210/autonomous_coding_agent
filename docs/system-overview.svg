<text x="1228.5" y="708" font-size="12" fill="#424a53" text-anchor="middle">Integration &amp; system tests (SWE.5-6, SYS.4)</text>
<text x="1228.5" y="728" font-size="12" font-weight="700" fill="#8c959f" text-anchor="middle">Planned</text>
